<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写真提示词生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        
        .section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .section-title:hover { color: #667eea; }
        .section-content {
            display: none;
        }
        .section-content.show { display: block; }
        .toggle-icon {
            margin-left: auto;
            transition: transform 0.3s;
        }
        .toggle-icon.rotate { transform: rotate(180deg); }
        
        input[type="password"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        input[type="password"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .upload-box {
            border: 3px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            background: #fafafa;
            transition: all 0.3s;
        }
        .upload-box:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        .upload-box.has-image {
            border-style: solid;
            border-color: #667eea;
            background: #f8f9ff;
            padding: 20px;
        }
        .upload-icon { font-size: 40px; margin-bottom: 10px; }
        .upload-text { color: #666; font-size: 16px; }
        .upload-hint { color: #999; font-size: 13px; margin-top: 8px; }
        
        #preview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            display: none;
        }
        #preview.show { display: block; margin: 0 auto; }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            transition: transform 0.2s;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show { display: block; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .result {
            display: none;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }
        .result.show { display: block; }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .result-title { font-weight: 600; color: #333; }
        .result-text {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
        }
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .error {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .error.show { display: block; }
        
        .tips {
            background: #e3f2fd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .tips-title { font-weight: 600; color: #1565c0; margin-bottom: 8px; }
        .tips-list { color: #555; font-size: 13px; padding-left: 18px; }
        .tips-list li { margin-bottom: 5px; }
        code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 写真提示词生成器</h1>
        <p class="subtitle">使用 Moonshot AI 自动分析图片并生成提示词</p>
        
        <div class="section">
            <div class="section-title" id="apiToggle">
                🔑 API 设置
                <span class="toggle-icon" id="apiToggleIcon">▼</span>
            </div>
            <div class="section-content" id="apiContent">
                <input type="password" id="apiKey" placeholder="请输入 Moonshot API Key" value="sk-HTvVqlqxSdeHTluXY3BWzxG3lqp2b78nYxOjzDy2bvkzYhyH">
                <select id="model">
                    <option value="moonshot-v1-8k-vision-preview">moonshot-v1-8k-vision-preview</option>
                    <option value="moonshot-v1-32k-vision-preview">moonshot-v1-32k-vision-preview</option>
                </select>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">📤 上传图片</div>
            <div class="upload-box" id="uploadBox">
                <img id="preview" alt="预览">
                <div id="uploadContent">
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">点击上传图片</div>
                    <div class="upload-hint">支持拖拽、截图粘贴 (Ctrl+V)</div>
                </div>
            </div>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
        </div>
        
        <button class="btn" id="generateBtn" disabled>✨ 生成提示词</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>AI 正在分析图片...</div>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result" id="result">
            <div class="result-header">
                <span class="result-title">🎯 生成的提示词</span>
                <button class="copy-btn" id="copyBtn">复制</button>
            </div>
            <div class="result-text" id="resultText"></div>
        </div>
        
        <div class="tips">
            <div class="tips-title">💡 使用说明</div>
            <ul class="tips-list">
                <li>API Key 已预填，可直接使用</li>
                <li>支持截图后按 <code>Ctrl+V</code> 粘贴上传</li>
                <li>生成的提示词包含反向提示词，减少手部畸形问题</li>
            </ul>
        </div>
    </div>

    <script>
        // 配置
        const API_URL = 'https://api.moonshot.cn/v1/chat/completions';
        
        // 获取元素
        const uploadBox = document.getElementById('uploadBox');
        const uploadContent = document.getElementById('uploadContent');
        const preview = document.getElementById('preview');
        const fileInput = document.getElementById('fileInput');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const error = document.getElementById('error');
        const apiKey = document.getElementById('apiKey');
        const model = document.getElementById('model');
        const copyBtn = document.getElementById('copyBtn');
        const apiToggle = document.getElementById('apiToggle');
        const apiContent = document.getElementById('apiContent');
        const apiToggleIcon = document.getElementById('apiToggleIcon');
        
        let imageBase64 = null;
        
        // API 设置折叠/展开
        apiToggle.onclick = () => {
            apiContent.classList.toggle('show');
            apiToggleIcon.classList.toggle('rotate');
        };
        
        // 点击上传
        uploadBox.onclick = (e) => {
            if (e.target !== preview) fileInput.click();
        };
        
        // 文件选择
        fileInput.onchange = (e) => {
            if (e.target.files[0]) handleFile(e.target.files[0]);
        };
        
        // 拖拽
        uploadBox.ondragover = (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#667eea';
        };
        uploadBox.ondragleave = () => {
            if (!imageBase64) uploadBox.style.borderColor = '#ddd';
        };
        uploadBox.ondrop = (e) => {
            e.preventDefault();
            if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };
        
        // 粘贴
        document.onpaste = (e) => {
            const items = e.clipboardData.items;
            for (let item of items) {
                if (item.type.startsWith('image/')) {
                    handleFile(item.getAsFile());
                    break;
                }
            }
        };
        
        // 处理文件
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('请上传图片文件');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                imageBase64 = e.target.result.split(',')[1];
                preview.src = e.target.result;
                preview.classList.add('show');
                uploadContent.style.display = 'none';
                uploadBox.classList.add('has-image');
                generateBtn.disabled = false;
                hideError();
            };
            reader.readAsDataURL(file);
        }
        
        // 生成提示词
        generateBtn.onclick = async () => {
            if (!imageBase64) return;
            
            const key = apiKey.value.trim();
            if (!key) {
                showError('请输入 API Key');
                return;
            }
            
            loading.classList.add('show');
            result.classList.remove('show');
            generateBtn.disabled = true;
            hideError();
            
            try {
                const prompt = await callAPI(key, imageBase64);
                resultText.textContent = prompt;
                result.classList.add('show');
            } catch (err) {
                showError(err.message || '生成失败');
            } finally {
                loading.classList.remove('show');
                generateBtn.disabled = false;
            }
        };
        
        // 调用 API
        async function callAPI(key, imgData) {
            const systemPrompt = `你是一个专业的写真提示词生成专家。请分析用户上传的参考图片，并按照以下固定模板格式生成提示词：

【固定开头 - 必须一字不差】
严格保持参考用户图1的人物五官、脸型特征和发型不变。参考参考图1的服饰和背景以及画面风格，参照参考图1的动作，保持参考图的景别，注意头身比例要完美，生产一张写真。去除用户图1的头饰。

【格式要求】
- 固定开头后，直接连接描述内容，形成一段连续的文字
- 用逗号、句号分隔不同部分
- 不要分点列出，不要换行分段
- 描述要有画面感，像摄影师描述作品一样流畅自然

【需要描述的内容维度】
1. 姿态动作 - 姿势、朝向、视线、手部动作
2. 服装造型 - 服装类型、颜色、细节、配饰
3. 场景环境 - 地点、背景元素、地标建筑、时间/天气
4. 光影效果 - 光源方向、光效类型、明暗对比
5. 构图景别 - 全身/半身/特写、焦距、景深效果
6. 色调风格 - 整体风格、主色调、氛围
7. 后期特效 - 调色、质感、特效处理

【正确示例】
严格保持参考用户图1的人物五官、脸型特征和发型不变。参考参考图1的服饰和背景以及画面风格，参照参考图1的动作，保持参考图的景别，注意头身比例要完美，生产一张写真。侧身站立，回头凝视镜头，黄色扎染图案的修身吊带长裙，泰国河岸边，背景是黄昏时分灯光照亮的郑王庙，天空呈现橙色到紫色的渐变，水面有波光，使用柔和的正面补光照亮人物主体，人物轮廓清晰，与背景的暖色灯光和天空的自然光形成对比，具有时尚感的旅拍人像摄影。整体色调温暖，采用中长焦镜头，大光圈营造出浅景深效果，使背景的寺庙呈柔和虚化状态。增强了天空和灯光的色彩饱和度，对人物皮肤进行了平滑处理但保留了质感，增加了轻微的胶片颗粒感，提升了整体画面的电影质感和氛围。

要求：
- 必须严格遵循固定开头
- 形成一段流畅的连续文字，不要分点
- 描述要有画面感和专业摄影术语
- 整体控制在200-400字左右

【反向提示词】
在生成的提示词后面，加上以下内容：
反向提示词：多手指，畸形手指，多余手指，手指粘连，手部畸形，变形的手，扭曲的手指，六指，七指，手指数量错误，手部结构错误，解剖学错误的手`;

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + key
                },
                body: JSON.stringify({
                    model: model.value,
                    messages: [
                        { role: 'system', content: systemPrompt },
                        {
                            role: 'user',
                            content: [
                                { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + imgData } },
                                { type: 'text', text: '请分析这张参考图片，按照模板格式生成写真提示词。' }
                            ]
                        }
                    ],
                    temperature: 0.7
                })
            });
            
            if (!response.ok) {
                const text = await response.text();
                throw new Error('请求失败: ' + response.status + ' - ' + text.substring(0, 200));
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        // 复制
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(resultText.textContent).then(() => {
                copyBtn.textContent = '已复制';
                setTimeout(() => copyBtn.textContent = '复制', 2000);
            });
        };
        
        // 错误处理
        function showError(msg) {
            error.textContent = msg;
            error.classList.add('show');
        }
        function hideError() {
            error.classList.remove('show');
        }
    </script>
</body>
</html>
